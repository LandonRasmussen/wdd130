
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div id="formContainer">

        <!-- Hero section -->
        <div id="hero">
    <h1>Daily Feed</h1>
    <h2>Scripture a Day</h2>

    <button type="button" id="closeBtn">X</button>
</div>

        <!-- Jesus image -->
        <div id="Feeds">
            <img src="images/jesus_feeds_5000.jpeg" id="logo"
                alt="Jesus feeding the multitude">
        </div>

        <!-- Signup heading -->
        <h3>Sign Up for Daily Scripture Feed</h3>

        <!-- Signup form -->
        <form id="myForm">



            <label for="username">User Name:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label>Gender:</label>

            <div class="genderOptions">
                <input type="radio" id="male" name="gender"
                    value="male" required>
                <label for="male">Male</label>

                <input type="radio" id="female" name="gender"
                    value="female" required>
                <label for="female">Female</label>
            </div>

            <section>
                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Subscribe to newsletter</label>
            </section>

            <section>
                <input type="checkbox" id="conditions"
                    name="conditions" required>
                <label for="conditions">
                    I acknowledge the terms and conditions
                </label>
            </section>

            <section>
                <button type="submit">Submit</button>
            </section>

        </form>

        <!-- Scripture books -->
        <div class="Books">
            <img src="images/old_testament.webp"
                id="bibleImage" alt="Old Testament">

            <img src="images/new_testament.webp"
                id="bibleImage2" alt="New Testament">

            <img src="images/book_of_mormon.webp"
                id="bibleImage3" alt="Book of Mormon">

            <img src="images/doctrine_and_covenants.webp"
                id="bibleImage4" alt="Doctrine and Covenants">

            <img src="images/pearl_of_great_price.webp"
                id="bibleImage5" alt="Pearl of Great Price">
        </div>

    </div>

    <script>
        // Close the signup card
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("formContainer").style.display = "none";
        });

        const form = document.getElementById("myForm");
        const output = document.getElementById("output");

        // Display submitted form information
        form.addEventListener("submit", function (event) {
            event.preventDefault();

            const formData = new FormData(form);
            const entries = [];

            for (const [key, value] of formData.entries()) {
                if (key === "password") {
                    entries.push(`<strong>${key}</strong>: [hidden]`);
                } else {
                    entries.push(`<strong>${key}</strong>: ${value}`);
                }
            }

            output.innerHTML = `
                <h3>Here is the data that would be sent to the server:</h3>
                <ul>
                    ${entries.map(item => `<li>${item}</li>`).join("")}
                </ul>
            `;
        });
    </script>

</body>
</html>
